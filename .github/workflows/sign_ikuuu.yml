name: Auto Sign-in for BBS

on:
  schedule:
    # 每天 UTC 23:10（北京时间次日 07:10）自动执行
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  sign_in_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests
          pip install playwright

      # 安装 Chromium 浏览器及其系统依赖
      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run sign-in script
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          IKUUU_DOMAIN: ${{ secrets.IKUUU_DOMAIN }}
          # 企业微信单变量合并配置（推荐）
          WECHAT_WORK: ${{ secrets.WECHAT_WORK }}
          WX_CONFIG: ${{ secrets.WX_CONFIG }}
          # 企业微信旧独立变量（兼容回退）
          WX_CORPID: ${{ secrets.WX_CORPID }}
          WX_CORPSECRET: ${{ secrets.WX_CORPSECRET }}
          WX_AGENTID: ${{ secrets.WX_AGENTID }}
          # 企业微信群机器人
          WX_WEBHOOK: ${{ secrets.WX_WEBHOOK }}
          # PushPlus 推送
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
        run: python sign_ikuuu.py
